<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img">
<title>trigBoard V8 to LD2410S wiring</title>
<desc>The trigBoard 4V2 and GND edge pins feed an MCP1700 regulator with 1 µF input and 1 µF plus 10 µF output capacitors, powering the LD2410S at 3.3V. LD2410S OT2 drives a PC817 LED through 1 kΩ; the PC817 transistor bridges trigger plus (pin 4) and trigger minus (pin 3).</desc>
<style>
  .bg { fill: #ffffff; }
  .box { fill: #F1EFE8; stroke: #888780; stroke-width: 1; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-size: 12px; fill: #5F5E5A; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .box { fill: #2C2C2A; stroke: #888780; }
    .th { fill: #F1EFE8; }
    .ts { fill: #D3D1C7; }
  }
</style>
<rect class="bg" x="0" y="0" width="680" height="500"/>
<rect x="40" y="60" width="130" height="380" rx="4" class="box"/>
<text x="105" y="270" text-anchor="middle" class="th">trigBoard V8</text>
<text x="105" y="288" text-anchor="middle" class="ts">sleeps &lt;1 µA</text>
<text x="160" y="144" text-anchor="end" class="ts">4V2 (edge)</text>
<text x="160" y="224" text-anchor="end" class="ts">GND (edge)</text>
<text x="160" y="334" text-anchor="end" class="ts">Trigger +</text>
<text x="160" y="394" text-anchor="end" class="ts">Trigger −</text>
<rect x="240" y="60" width="140" height="110" rx="4" class="box"/>
<text x="310" y="92" text-anchor="middle" class="th">MCP1700-3302E</text>
<text x="310" y="110" text-anchor="middle" class="ts">3.3V regulator</text>
<text x="248" y="144" class="ts">VIN</text>
<text x="372" y="144" text-anchor="end" class="ts">VOUT</text>
<text x="310" y="162" text-anchor="middle" class="ts">GND</text>
<rect x="500" y="100" width="140" height="260" rx="4" class="box"/>
<text x="580" y="272" text-anchor="middle" class="th">LD2410S</text>
<text x="580" y="290" text-anchor="middle" class="ts">radar sensor</text>
<text x="508" y="144" class="ts">3V3</text>
<text x="508" y="224" class="ts">GND</text>
<text x="508" y="334" class="ts">OT2</text>
<rect x="290" y="300" width="120" height="120" rx="4" class="box"/>
<text x="350" y="364" text-anchor="middle" class="th">PC817</text>
<text x="298" y="334" class="ts">4 C</text>
<text x="298" y="394" class="ts">3 E</text>
<text x="402" y="334" text-anchor="end" class="ts">A 1</text>
<text x="402" y="394" text-anchor="end" class="ts">K 2</text>
<line x1="170" y1="140" x2="240" y2="140" stroke="#D85A30" stroke-width="2"/>
<line x1="380" y1="140" x2="500" y2="140" stroke="#7F77DD" stroke-width="2"/>
<line x1="170" y1="220" x2="500" y2="220" stroke="#888780" stroke-width="2"/>
<line x1="310" y1="170" x2="310" y2="220" stroke="#888780" stroke-width="2"/>
<circle cx="310" cy="220" r="3.5" fill="#888780"/>
