<circle cx="200" cy="140" r="3.5" fill="#D85A30"/>
<circle cx="200" cy="220" r="3.5" fill="#888780"/>
<text x="214" y="185" class="ts">1µF</text>
<line x1="405" y1="140" x2="405" y2="176" stroke="#7F77DD" stroke-width="2"/>
<line x1="395" y1="176" x2="415" y2="176" stroke="#7F77DD" stroke-width="2.5"/>
<line x1="395" y1="184" x2="415" y2="184" stroke="#888780" stroke-width="2.5"/>
<line x1="405" y1="184" x2="405" y2="220" stroke="#888780" stroke-width="2"/>
<circle cx="405" cy="140" r="3.5" fill="#7F77DD"/>
<circle cx="405" cy="220" r="3.5" fill="#888780"/>
