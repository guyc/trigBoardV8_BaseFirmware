<line x1="440" y1="176" x2="460" y2="176" stroke="#7F77DD" stroke-width="2.5"/>
<line x1="440" y1="184" x2="460" y2="184" stroke="#888780" stroke-width="2.5"/>
<line x1="450" y1="184" x2="450" y2="220" stroke="#888780" stroke-width="2"/>
<circle cx="450" cy="140" r="3.5" fill="#7F77DD"/>
<circle cx="450" cy="220" r="3.5" fill="#888780"/>
<text x="464" y="185" class="ts">10µF</text>
<line x1="170" y1="330" x2="290" y2="330" stroke="#D85A30" stroke-width="2"/>
<line x1="170" y1="390" x2="290" y2="390" stroke="#1D9E75" stroke-width="2"/>
<line x1="500" y1="330" x2="470" y2="330" stroke="#1D9E75" stroke-width="2"/>
<rect x="430" y="323" width="40" height="14" rx="2" fill="none" stroke="#1D9E75" stroke-width="2"/>
<line x1="430" y1="330" x2="410" y2="330" stroke="#1D9E75" stroke-width="2"/>
<text x="450" y="315" text-anchor="middle" class="ts">1kΩ</text>
<polyline points="410,390 450,390 450,408" fill="none" stroke="#888780" stroke-width="2"/>
<line x1="440" y1="408" x2="460" y2="408" stroke="#888780" stroke-width="2"/>
<line x1="444" y1="414" x2="456" y2="414" stroke="#888780" stroke-width="2"/>
<line x1="448" y1="420" x2="452" y2="420" stroke="#888780" stroke-width="2"/>
<text x="466" y="418" class="ts">GND</text>
<line x1="40" y1="470" x2="64" y2="470" stroke="#D85A30" stroke-width="2"/>
<text x="72" y="474" class="ts">4.2V always on</text>
<line x1="190" y1="470" x2="214" y2="470" stroke="#7F77DD" stroke-width="2"/>
<text x="222" y="474" class="ts">3.3V regulated</text>
<line x1="340" y1="470" x2="364" y2="470" stroke="#888780" stroke-width="2"/>
