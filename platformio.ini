; PlatformIO build for the trigBoard V8 (ESP32).
; Pinned to the toolchain the stock firmware was released with:
;   - Arduino ESP32 core 1.0.4 (platform espressif32 1.12.4)
;   - "Minimal SPIFFS" partitions: app slots must match what's on the board, and
;     SPIFFS (holding /config.txt) must stay at 0x3D0000
;   - ArduinoJson 6.x
;   - Pushsafer is vendored in lib/ with the author's SSL patch

[platformio]
src_dir = .
default_envs = trigboard

[env:trigboard]
platform = espressif32@1.12.4
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.f_flash = 80000000L
board_build.flash_mode = dio
build_src_filter = +<*> -<lib/> -<tools/> -<factoryProg/>
lib_deps =
    bblanchon/ArduinoJson@6.17.2
    knolleary/PubSubClient@2.8
; Firmware is uploaded over WiFi (ArduinoOTA, no password). Start OTA mode from the
; Bluetooth configurator first, then: make deploy IP=<board-ip>
upload_protocol = espota
upload_flags = --port=3232
